name: Publish Docker image to GHCR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (for example: latest, 1.0.0)"
        required: true
        default: "latest"
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-simlab-image
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/djayzone/simlab
      TAG: ${{ inputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate tag
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker tag: $TAG"
            exit 1
          fi

      - name: Login to GitHub Container Registry
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        shell: bash
        run: |
          docker build --pull             --label "org.opencontainers.image.source=https://github.com/djayzone/simlab"             --label "org.opencontainers.image.revision=${{ github.sha }}"             -t "$IMAGE:$TAG" .

      - name: Push image
        shell: bash
        run: |
          docker push "$IMAGE:$TAG"

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Published image"
            echo
            echo "`$IMAGE:$TAG`"
          } >> "$GITHUB_STEP_SUMMARY"
