name: Documentation improvement
description: Improve guides, translations, examples or onboarding
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: area
    attributes:
      label: What should be improved?
      description: Mention the page, section or missing documentation.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I can open a pull request for this.
